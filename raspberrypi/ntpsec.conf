# APRS LoRa+ Rotor - hora de la Raspberry Pi con NTPsec (lo instala install.sh; el original queda en ntp.conf.orig)
# Copyright (C) 2026 Manuel - EA7JRS - GPL-3.0-or-later
#
# Hora oficial de Espana: Real Instituto y Observatorio de la Armada (ROA). nts1.roa.es con NTS (hora firmada) y, sin
# cifrar, hora.roa.es y minuto.roa.es (los dos de ntp.roa.es). pool.ntp.org de reserva.
# Con un GPS en gpsd (USB o el NMEA de la red con gpsd -n), gpsd deja la hora en la memoria compartida: unidad 0 = NMEA
# (unos 100-500 ms de retraso segun el receptor: ajustar time1) y unidad 1 = PPS si el receptor lo da (microsegundos).

driftfile /var/lib/ntpsec/ntp.drift
leapfile /usr/share/zoneinfo/leap-seconds.list

server nts1.roa.es nts iburst prefer
server hora.roa.es iburst
server minuto.roa.es iburst
pool pool.ntp.org iburst

# GPS por gpsd (si no hay gpsd, ntpd las da por perdidas y sigue con internet)
refclock shm unit 0 refid GPS time1 0.2 minpoll 4 maxpoll 4
refclock shm unit 1 refid PPS prefer minpoll 4 maxpoll 4

restrict default kod limited nomodify noquery
restrict -6 default kod limited nomodify noquery
restrict 127.0.0.1
restrict -6 ::1
