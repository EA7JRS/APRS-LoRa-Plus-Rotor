;
; Placas:  ESP32 (Bluetooth clasico + BLE), ESP32-S3 (BLE), Waveshare ESP32-C5-Touch-LCD-3.5 (WiFi 2,4/5 GHz + BLE + pantalla tactil),
;          Waveshare ESP32-S3-Touch-AMOLED-2.41 (pantalla tactil AMOLED), Raspberry Pi Pico 2 W (WiFi + Bluetooth) y Pico 2 (solo USB / LoRa)
; Los pines por defecto de cada placa estan en los DEF_* de cada entorno; todos se cambian luego en la configuracion (WebUI / app).

[platformio]
default_envs = esp32dev
src_dir = src

[common]
; Avisos como errores solo en el codigo propio (las librerias del framework tienen los suyos)
build_src_flags =
	-Wall
	-Werror
	-Wno-error=cpp
	-Wno-error=deprecated-declarations
build_flags =
	-std=gnu++17
	-D ARDUINOJSON_ENABLE_STD_STRING=1
	-D RADIOLIB_EXCLUDE_CC1101=1
	-D RADIOLIB_EXCLUDE_RF69=1
	-D RADIOLIB_EXCLUDE_RFM2X=1
	-D RADIOLIB_EXCLUDE_SX1231=1
	-D RADIOLIB_EXCLUDE_SX1233=1
	-D RADIOLIB_EXCLUDE_SI443X=1
	-D RADIOLIB_EXCLUDE_NRF24=1
	-D RADIOLIB_EXCLUDE_AFSK=1
	-D RADIOLIB_EXCLUDE_APRS=1
	-D RADIOLIB_EXCLUDE_AX25=1
	-D RADIOLIB_EXCLUDE_BELL=1
	-D RADIOLIB_EXCLUDE_FSK4=1
	-D RADIOLIB_EXCLUDE_HELLSCHREIBER=1
	-D RADIOLIB_EXCLUDE_LORAWAN=1
	-D RADIOLIB_EXCLUDE_MORSE=1
	-D RADIOLIB_EXCLUDE_PAGER=1
	-D RADIOLIB_EXCLUDE_RTTY=1
	-D RADIOLIB_EXCLUDE_SSTV=1
	-D RADIOLIB_EXCLUDE_LR11X0=1
	-D RADIOLIB_EXCLUDE_SX128X=1
	-D ROTOR_BOARD='"${PIOENV}"'
lib_deps =
	bblanchon/ArduinoJson @ 7.4.3
	jgromes/RadioLib @ 7.8.1

; ------------------------------------------------------------------ ESP32 ------------------------------------------------------------------
[esp32]
platform = espressif32 @ 8.0.0
build_src_flags = ${common.build_src_flags}
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
	${common.lib_deps}
	h2zero/NimBLE-Arduino @ 2.5.2
build_flags =
	${common.build_flags}
	-D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED=1
	-D CONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED=1
	-D ROTOR_HAS_BLE=1

; ESP32 generico (DevKit V1 / WROOM-32, 4 MB). Bluetooth clasico (SPP GS-232 para el tracker) o BLE (app), uno de los dos
[env:esp32dev]
extends = esp32
board = esp32dev
board_build.partitions = huge_app.csv
board_build.filesystem = littlefs
build_flags =
	${esp32.build_flags}
	-D ROTOR_HAS_SPP=1
	-D DEF_AZ_CW=25 -D DEF_AZ_CCW=26 -D DEF_EL_UP=27 -D DEF_EL_DOWN=14
	-D DEF_AZ_ADC=34 -D DEF_EL_ADC=35 -D DEF_I2C_SDA=21 -D DEF_I2C_SCL=22
	-D DEF_SER_RX=16 -D DEF_SER_TX=17 -D DEF_LED=2

; ESP32-S3 DevKitC-1 (8 MB)
[env:esp32s3]
extends = esp32
board = esp32-s3-devkitc-1
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
board_build.filesystem = littlefs
build_flags =
	${esp32.build_flags}
	-D ARDUINO_USB_MODE=1 -D ARDUINO_USB_CDC_ON_BOOT=1
	-D DEF_AZ_CW=4 -D DEF_AZ_CCW=5 -D DEF_EL_UP=6 -D DEF_EL_DOWN=7
	-D DEF_AZ_ADC=1 -D DEF_EL_ADC=2 -D DEF_I2C_SDA=8 -D DEF_I2C_SCL=9
	-D DEF_SER_RX=18 -D DEF_SER_TX=17 -D DEF_LED=48

; Waveshare ESP32-C5-Touch-LCD-3.5: ESP32-C5 (WiFi 2,4 / 5 GHz, BLE; sin Bluetooth clasico), pantalla tactil ST7796 320x480 + FT6336,
; 8 MB de PSRAM, 32 MB de flash (se usan 16). Sin LoRa. Reles en EXIO8-EXIO11 del expansor CH32V (pines 108-111 del conector),
; potenciometro del acimut en EXIO_ADC (pin 200); la elevacion necesita un ADS1115 en el I2C del conector (SDA 27, SCL 26).
; Pasarela serie por U0TXD / U0RXD del conector (GPIO11 / GPIO12). El ESP32-C5 necesita Arduino 3.3 con el soporte del C5:
; plataforma pioarduino (la espressif32 oficial no lo trae), misma version de Arduino (3.3.12) que el resto.
[env:waveshare_c5_lcd35]
extends = esp32
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-c5-devkitc1-n8r4
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
build_flags =
	${esp32.build_flags}
	-D ARDUINO_USB_MODE=1 -D ARDUINO_USB_CDC_ON_BOOT=1
	-D ROTOR_HAS_LCD=1 -D ROTOR_HAS_EXIO=1 -D EXIO_SDA=27 -D EXIO_SCL=26
	-D DEF_AZ_CW=108 -D DEF_AZ_CCW=109 -D DEF_EL_UP=110 -D DEF_EL_DOWN=111
	-D DEF_AZ_ADC=200 -D DEF_EL_ADC=-1 -D DEF_EL_ENABLED=0 -D DEF_RAW_A=1596 -D DEF_RAW_B=3590
	-D DEF_I2C_SDA=27 -D DEF_I2C_SCL=26 -D DEF_SER_RX=12 -D DEF_SER_TX=11 -D DEF_LED=-1

; Waveshare ESP32-S3-Touch-AMOLED-2.41 (V2): ESP32-S3R8 (8 MB PSRAM octal), 16 MB de flash, AMOLED RM690B0 600x450 por QSPI
; (apaisada) + FT6336, TCA9554 (0x20), RTC, IMU. Sin LoRa. Conector de 34 pines con GPIO directos: reles en IO38-IO41,
; potenciometros en IO1 (AZ) e IO7 (EL) del ADC1, I2C 47 / 48 (ADS1115 opcional), pasarela serie por TXD / RXD (IO43 / IO44).
; IO16 arriba al arrancar: mantiene la placa encendida con bateria.
[env:waveshare_s3_amoled241]
extends = esp32
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
build_flags =
	${esp32.build_flags}
	-D BOARD_HAS_PSRAM
	-D ARDUINO_USB_MODE=1 -D ARDUINO_USB_CDC_ON_BOOT=1
	-D ROTOR_HAS_LCD=1 -D LCD_PANEL=2 -D ROTOR_HAS_EXIO=1 -D EXIO_CHIP=2 -D EXIO_SDA=47 -D EXIO_SCL=48 -D BOARD_POWER_HOLD=16
	-D DEF_AZ_CW=38 -D DEF_AZ_CCW=39 -D DEF_EL_UP=40 -D DEF_EL_DOWN=41
	-D DEF_AZ_ADC=1 -D DEF_EL_ADC=7 -D DEF_I2C_SDA=47 -D DEF_I2C_SCL=48
	-D DEF_SER_RX=44 -D DEF_SER_TX=43 -D DEF_LED=-1

; ----------------------------------------------------------- Raspberry Pi Pico 2 ---------------------------------------------------------
[rp2350]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
build_src_flags = ${common.build_src_flags}
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
lib_deps = ${common.lib_deps}
build_flags =
	${common.build_flags}
	-D DEF_AZ_CW=6 -D DEF_AZ_CCW=7 -D DEF_EL_UP=8 -D DEF_EL_DOWN=9
	-D DEF_AZ_ADC=26 -D DEF_EL_ADC=27 -D DEF_I2C_SDA=4 -D DEF_I2C_SCL=5
	-D DEF_SER_RX=1 -D DEF_SER_TX=0 -D DEF_LED=-1
	-D DEF_LORA_SCK=10 -D DEF_LORA_MISO=12 -D DEF_LORA_MOSI=11 -D DEF_LORA_CS=3
	-D DEF_LORA_RST=15 -D DEF_LORA_IRQ=20 -D DEF_LORA_BUSY=2

; Pico 2 W: WiFi (rotctld, WebUI, API) y Bluetooth clasico (SPP GS-232). LoRa con el HAT SX1262 de Waveshare (pines por defecto)
[env:pico2w]
extends = rp2350
board = rpipico2w
board_build.filesystem_size = 1m
build_flags =
	${rp2350.build_flags}
	-D PIO_FRAMEWORK_ARDUINO_ENABLE_BLUETOOTH
	-D ROTOR_HAS_WIFI=1 -D ROTOR_HAS_SPP=1

; Pico 2 sin radio: USB (GS-232 / EasyComm / Rot2Prog / rotctld por USB) y LoRa APRS
[env:pico2]
extends = rp2350
board = rpipico2
board_build.filesystem_size = 0.5m
lib_ignore = SerialBT, WiFi, WebServer, HTTPUpdateServer, LEAmDNS
